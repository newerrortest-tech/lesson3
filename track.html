<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0"/>
    <title>Отследить посылку</title>
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/base_adaptive.css"/>
    <link rel="stylesheet" href="styles/track.css"/>
    <link rel="stylesheet" href="styles/track_adaptive.css"/>
</head>
<body>
<div class="container">
    <div class="track-content">
        <div class="track-card">
            <div class="track-title">Отследить посылку</div>
            <div class="track-action">
                <div class="main-field track-field">
                    <input id="trackNumber" type="text" placeholder="Введите номер отправления" autocomplete="off"/>
                </div>
                <button id="trackButton" class="button track-button" type="button">Отследить</button>
            </div>
        </div>

        <div class="track-card track-result" id="trackResult">
            <div class="track-result-header">
                <div class="track-id" id="trackIdValue">Посылка № —</div>
                <div class="track-routes">
                    <div class="track-route"><span class="track-route-pin">●</span><span id="trackFromValue">Откуда: Москва, улица Арбат, 1</span></div>
                    <div class="track-route"><span class="track-route-pin">●</span><span id="trackToValue">Куда: Минск, проспект Независимости, 58</span></div>
                </div>
            </div>
            <div class="track-info">
                <div class="track-status-title">Статус доставки</div>
                <div class="track-status-list" id="trackStatusList"></div>
            </div>
        </div>
    </div>
</div>
<script src="scripts/track.js"></script>
</body>
</html>
